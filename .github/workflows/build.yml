name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node scripts/build.mjs ${{ matrix.target }} ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Lint (Firefox)
        if: matrix.target == 'firefox'
        run: npx --yes web-ext lint --source-dir dist/firefox --self-hosted

      - name: Package
        run: |
          cd dist/${{ matrix.target }}
          zip -r ../youtube-live-anticensor-${{ matrix.target }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-live-anticensor-${{ matrix.target }}
          path: dist/youtube-live-anticensor-${{ matrix.target }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --generate-notes
